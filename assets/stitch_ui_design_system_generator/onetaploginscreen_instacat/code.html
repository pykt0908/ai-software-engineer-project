<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>OneTapLoginScreen - InstaCat</title>
<!-- Google Fonts: Plus Jakarta Sans & Grand Hotel for script wordmark -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#f97316',
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c'
            },
            surface: {
              DEFAULT: '#ffffff',
              card: '#fcf9f8',
              dim: '#dcd9d9',
              border: '#f1eee9'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            script: ['"Grand Hotel"', 'cursive']
          }
        }
      }
    }
  </script>
<!-- Custom Typography & Layout Overrides -->
<style data-purpose="custom-typography">
    .brand-wordmark {
      font-family: 'Grand Hotel', cursive;
      letter-spacing: -0.01em;
    }
  </style>
<style data-purpose="mobile-viewport">
    /* iOS smooth tap highlight removal */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 font-sans antialiased">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[420px] h-[100dvh] sm:h-[880px] sm:max-h-[92vh] bg-white sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between relative border border-stone-200">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none text-black" data-purpose="status-bar">
<!-- Current Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Cellular, Wifi, and Battery Icons -->
<div aria-hidden="true" class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 fill-current" viewBox="0 0 17 11">
<rect height="3" rx="0.6" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.6" width="3" x="4.6" y="5.5"></rect>
<rect height="8" rx="0.6" width="3" x="9.3" y="3"></rect>
<rect height="10.5" rx="0.6" width="3" x="14" y="0.5"></rect>
</svg>
<!-- WiFi Icon -->
<svg class="w-4 h-3 fill-current" viewBox="0 0 16 12">
<path d="M8 2.8C10.6 2.8 12.9 3.8 14.7 5.4L16 3.9C13.8 1.9 11 0.7 8 0.7C5 0.7 2.2 1.9 0 3.9L1.3 5.4C3.1 3.8 5.4 2.8 8 2.8ZM8 6.4C9.6 6.4 11.1 7.1 12.2 8.2L13.5 6.7C12 5.3 10.1 4.4 8 4.4C5.9 4.4 4 5.3 2.5 6.7L3.8 8.2C4.9 7.1 6.4 6.4 8 6.4ZM8 10C8.8 10 9.5 10.7 9.5 11.5C9.5 12.3 8.8 13 8 13C7.2 13 6.5 12.3 6.5 11.5C6.5 10.7 7.2 10 8 10Z"></path>
</svg>
<!-- Battery Indicator -->
<div class="flex items-center">
<div class="w-5 h-[11px] border border-black rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-black rounded-[1.5px]"></div>
</div>
<div class="w-[1.5px] h-[4px] bg-black rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: MainContentArea -->
<div class="flex-1 flex flex-col justify-center px-8 pb-12 pt-4">
<!-- Brand Logo Header -->
<section class="text-center mb-10" data-purpose="brand-header">
<div class="inline-flex items-center justify-center space-x-1">
<h1 class="text-5xl brand-wordmark text-stone-900 tracking-tight select-none">
            InstaCat
          </h1>
<!-- Cat Paw Icon Accent -->
<svg class="w-6 h-6 text-brand-500 mb-4 transform -rotate-12 fill-current" viewBox="0 0 24 24">
<ellipse cx="6.5" cy="8.5" rx="2" ry="3"></ellipse>
<ellipse cx="12" cy="6" rx="2.2" ry="3.2"></ellipse>
<ellipse cx="17.5" cy="8.5" rx="2" ry="3"></ellipse>
<ellipse cx="3.8" cy="14" rx="1.8" ry="2.5"></ellipse>
<path d="M12,11.5 C8.8,11.5 6.2,14.2 6.8,18 C7.2,20.4 9.3,22 12,22 C14.7,22 16.8,20.4 17.2,18 C17.8,14.2 15.2,11.5 12,11.5 Z"></path>
</svg>
</div>
<p class="text-xs tracking-wider uppercase font-semibold text-stone-400 mt-1">The Cozy Cat Social Club</p>
</section>
<!-- Saved Account Profile Card -->
<section class="flex flex-col items-center mb-8" data-purpose="saved-account-card">
<!-- Avatar with Warm Border & Subtle Shadow -->
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-full p-[3px] bg-gradient-to-tr from-amber-400 via-brand-500 to-rose-500 shadow-md transition-transform duration-200 group-hover:scale-105">
<div class="w-full h-full rounded-full overflow-hidden bg-white p-[2px]">
<img alt="Profile picture of Mochi the Ragdoll Cat" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBc6PvXniwpaJ4gwo84RWulf9E9kaI3PdO__uFbKxM-J59Z8CoqEwktZ5uyHaBnHFv95p5aGNHWPeFnb8_bs0HxVOAUI7NlAnxI9oL4LX11nBlcrKaY64a3YTdscwxp9moZ75zT9p5N2k49waiqXWgCVAc3huJ3NNIoYz9BEURq-LWQ8BY7TwfZ9IV2vPMkfXZLsqmUbwZOz_FopuNUg3yNcW8UqTvkbkU-V43AsJy8ZiXoWCrgaougRg">
</div>
</div>
<!-- Verified Paw Badge -->
<div class="absolute bottom-1 right-1 bg-white rounded-full p-1 shadow-sm border border-stone-100 flex items-center justify-center">
<div class="bg-brand-500 text-white rounded-full p-0.5">
<svg class="w-3 h-3 fill-current" viewBox="0 0 20 20">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</div>
<!-- Account Labels -->
<div class="text-center mt-4">
<h2 class="text-lg font-bold text-stone-900 tracking-tight">mochi_the_ragdoll</h2>
<span class="inline-block mt-0.5 text-xs font-medium text-stone-500 bg-stone-100 px-2.5 py-0.5 rounded-full">
            Ragdoll • Cat Creator
          </span>
</div>
</section>
<!-- Actions Section -->
<section class="flex flex-col items-center space-y-4 w-full" data-purpose="login-actions">
<!-- One-Tap Primary Login Button -->
<button class="w-full py-3.5 px-4 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] text-white font-semibold text-sm rounded-xl shadow-lg shadow-orange-500/20 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-400 focus:ring-offset-2" type="button">
          Log In
        </button>
<!-- Switch Accounts Secondary Link -->
<button class="py-2 px-4 text-sm font-semibold text-brand-500 hover:text-brand-600 active:opacity-75 transition duration-150 ease-in-out" type="button">
          Switch accounts
        </button>
</section>
</div>
<!-- END: MainContentArea -->
<!-- BEGIN: FooterContainer -->
<footer class="w-full shrink-0 flex flex-col items-center" data-purpose="signup-footer">
<!-- Top Dividing Line -->
<div class="w-full h-px bg-stone-200"></div>
<!-- Sign Up Direct Link -->
<div class="py-4 text-center">
<p class="text-[13px] text-stone-500">
          Don't have an account? 
          <a class="font-bold text-stone-900 hover:text-brand-600 ml-1" href="#signup">Sign up.</a>
</p>
</div>
<!-- iOS Home Indicator Indicator Bar -->
<div class="pb-2 pt-1 w-full flex justify-center">
<div class="w-36 h-1 bg-black rounded-full mb-1"></div>
</div>
</footer>
<!-- END: FooterContainer -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
