<!-- Interactive JavaScript micro-interactions -->
<script>
    const captionInput = document.getElementById('captionInput');
    const charCount = document.getElementById('charCount');
    const shareButton = document.getElementById('shareButton');

    captionInput.addEventListener('input', () => {
      const len = captionInput.value.length;
      charCount.textContent = `${len}/2,200`;
    });

    function insertEmoji(emoji) {
      captionInput.value += ` ${emoji}`;
      captionInput.focus();
      captionInput.dispatchEvent(new Event('input'));
    }

    function insertTag(tag) {
      if (!captionInput.value.includes(tag)) {
        captionInput.value += ` ${tag}`;
        captionInput.focus();
        captionInput.dispatchEvent(new Event('input'));
      }
    }

    function simulateShare() {
      const originalText = shareButton.innerHTML;
      shareButton.innerHTML = `<span class="material-symbols-outlined !text-[16px] animate-spin">progress_activity</span>`;
      setTimeout(() => {
        alert('🎉 Meow! Your cat post has been published to InstaCat.');
        shareButton.innerHTML = originalText;
      }, 700);
    }
    
    shareButton.addEventListener('click', simulateShare);
  </script>
