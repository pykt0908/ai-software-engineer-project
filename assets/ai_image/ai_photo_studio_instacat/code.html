<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Studio - InstaCat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#F97316',
              50: '#FFF7ED',
              100: '#FFEDD5',
              200: '#FED7AA',
              500: '#F97316',
              600: '#EA580C',
              700: '#C2410C',
            }
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-rounded.filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] flex justify-center items-start min-h-screen font-sans antialiased text-gray-900 selection:bg-orange-100">

  <!-- Mobile Frame Container (390px width) -->
  <div class="w-full max-w-[390px] min-h-screen bg-white flex flex-col shadow-2xl relative overflow-hidden border-x border-gray-100 pb-8">

    <!-- Status Bar -->
    <div class="sticky top-0 z-30 bg-white/95 backdrop-blur-md px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold tracking-tight text-gray-900">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <span class="material-symbols-rounded text-sm">signal_cellular_alt</span>
        <span class="material-symbols-rounded text-sm">wifi</span>
        <span class="material-symbols-rounded text-sm">battery_full</span>
      </div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="sticky top-8 z-20 bg-white/95 backdrop-blur-md px-4 py-2.5 border-b border-gray-100 flex items-center justify-between">
      <button class="flex items-center gap-1 text-gray-700 hover:text-gray-900 transition-colors p-1 -ml-1 rounded-full hover:bg-gray-100 active:scale-95" aria-label="Go Back">
        <span class="material-symbols-rounded text-2xl">arrow_back_ios_new</span>
      </button>

      <div class="flex items-center gap-1.5">
        <h1 class="font-bold text-[17px] text-gray-900 tracking-tight">AI Photo Studio</h1>
        <span class="bg-orange-100 text-orange-600 text-[10px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-wider">Beta</span>
      </div>

      <button class="text-xs font-semibold text-gray-500 hover:text-gray-800 transition-colors px-2 py-1 rounded-md hover:bg-gray-100">
        Reset
      </button>
    </header>

    <!-- Main Scrollable Content -->
    <main class="flex-1 overflow-y-auto px-4 pt-3 pb-6 flex flex-col gap-4">

      <!-- Photo Preview Section -->
      <div class="relative w-full aspect-square rounded-2xl overflow-hidden bg-stone-100 shadow-sm border border-gray-100 group">
        <img 
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9iFjvy4bPZUGcq0gvpEjVQkaYrox6f-d22PM-aSBYcSaNPvszfZ3oZVg08awFTpm-p2CzqDt8mTqByuSZ1KJbsqHdDVg3o0Zpq1JGiA3R9r2lbLoTLXV9J33VsEZJfS5n6O9cbBEgIsIi1EcG72R5sHqiXrJgWfV70EvWJ0hI9JRpF8mWynr8R7jWBjzMKzJA_DSHEKEhm5NDaTj9YMO0OhUVJc8BWvpIFrrzYrfhQ8T7D-xpl7KHGg" 
          alt="Selected Cat Photo" 
          class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        />

        <!-- Badges & Overlay Tools -->
        <div class="absolute top-3 left-3 flex items-center gap-1.5 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-white text-xs font-medium shadow-sm">
          <span class="material-symbols-rounded text-sm text-orange-400 filled">auto_awesome</span>
          <span>Original Photo</span>
        </div>

        <div class="absolute top-3 right-3 flex items-center gap-1">
          <button class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center hover:bg-black/70 active:scale-90 transition">
            <span class="material-symbols-rounded text-lg">crop</span>
          </button>
          <button class="w-8 h-8 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center hover:bg-black/70 active:scale-90 transition">
            <span class="material-symbols-rounded text-lg">palette</span>
          </button>
        </div>

        <!-- Subtle AI Glow Line indicator at bottom -->
        <div class="absolute bottom-0 inset-x-0 h-1 bg-gradient-to-r from-orange-400 via-amber-300 to-orange-500 opacity-90"></div>
      </div>

      <!-- AI Quick Action Presets -->
      <section class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-0.5">
          <label class="text-[12px] font-bold text-gray-500 tracking-wide uppercase flex items-center gap-1">
            <span class="material-symbols-rounded text-orange-500 text-sm filled">magic_button</span>
            AI Quick Actions
          </label>
          <span class="text-[11px] text-gray-400 font-medium">1-Tap Enhance</span>
        </div>

        <!-- Horizontal Scrollable Chips -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 -mx-1 px-1">
          <!-- Active Chip (Enhance) -->
          <button class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-orange-50 border-2 border-orange-500 text-orange-700 font-semibold text-xs shrink-0 shadow-sm active:scale-95 transition">
            <span class="material-symbols-rounded text-base text-orange-500 filled">auto_fix_high</span>
            <span>Enhance</span>
          </button>

          <!-- Preset: Brighten -->
          <button class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gray-50 border border-gray-200 hover:border-orange-300 hover:bg-orange-50/50 text-gray-700 font-medium text-xs shrink-0 active:scale-95 transition">
            <span class="material-symbols-rounded text-base text-amber-500">light_mode</span>
            <span>Brighten</span>
          </button>

          <!-- Preset: Warm -->
          <button class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gray-50 border border-gray-200 hover:border-orange-300 hover:bg-orange-50/50 text-gray-700 font-medium text-xs shrink-0 active:scale-95 transition">
            <span class="material-symbols-rounded text-base text-orange-500">wb_sunny</span>
            <span>Warm</span>
          </button>

          <!-- Preset: Cute -->
          <button class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gray-50 border border-gray-200 hover:border-orange-300 hover:bg-orange-50/50 text-gray-700 font-medium text-xs shrink-0 active:scale-95 transition">
            <span class="material-symbols-rounded text-base text-pink-500">pets</span>
            <span>Cute</span>
          </button>

          <!-- Preset: Cinematic -->
          <button class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gray-50 border border-gray-200 hover:border-orange-300 hover:bg-orange-50/50 text-gray-700 font-medium text-xs shrink-0 active:scale-95 transition">
            <span class="material-symbols-rounded text-base text-purple-500">movie</span>
            <span>Cinematic</span>
          </button>
        </div>
      </section>

      <!-- Natural Language Prompt Editor -->
      <section class="flex flex-col gap-2 bg-stone-50/90 border border-gray-200/90 rounded-2xl p-3.5">
        <div class="flex items-center justify-between">
          <label class="text-[12px] font-bold text-gray-700 flex items-center gap-1.5">
            <span class="material-symbols-rounded text-orange-500 text-[17px] filled">edit_note</span>
            Describe how you want to edit this photo
          </label>
          <span class="text-[11px] text-gray-400 font-medium">AI Prompt</span>
        </div>

        <!-- Textarea with custom styled container -->
        <div class="relative bg-white rounded-xl border border-gray-200 focus-within:border-orange-500 focus-within:ring-2 focus-within:ring-orange-100 transition-all p-2.5">
          <textarea 
            rows="3" 
            class="w-full resize-none text-[13px] text-gray-800 placeholder-gray-400 focus:outline-none leading-relaxed"
            placeholder="e.g. Make my cat brighter, sharper and more adorable while keeping natural fur texture..."
          >Brighten the photo, improve fur details, enhance natural colors and create a warm cozy atmosphere.</textarea>
          
          <div class="flex justify-between items-center pt-1 border-t border-gray-100 mt-1.5">
            <span class="text-[11px] text-gray-400 font-medium">92/200 chars</span>
            <button class="text-[11px] text-gray-400 hover:text-gray-600 font-medium flex items-center gap-0.5">
              <span class="material-symbols-rounded text-xs">clear</span>
              Clear
            </button>
          </div>
        </div>

        <!-- Secondary AI Prompt Generator Action Button -->
        <button class="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-white border border-orange-200 hover:bg-orange-50/70 hover:border-orange-300 text-orange-600 font-semibold text-xs shadow-xs active:scale-[0.98] transition">
          <span class="material-symbols-rounded text-base text-orange-500 filled">auto_awesome</span>
          <span>✨ Generate Prompt with AI</span>
          <span class="bg-orange-100 text-orange-700 text-[10px] font-bold px-1.5 py-0.2 rounded ml-0.5">Auto</span>
        </button>
      </section>

      <!-- Action Buttons (Bottom Sticky or Flow) -->
      <div class="flex flex-col gap-2.5 pt-2">
        <!-- Primary CTA: Apply AI Edit -->
        <button class="w-full h-12 rounded-xl bg-orange-500 hover:bg-orange-600 active:scale-[0.98] text-white font-bold text-[15px] flex items-center justify-center gap-2 shadow-md shadow-orange-500/25 transition-all">
          <span class="material-symbols-rounded text-xl filled">auto_awesome</span>
          <span>✨ Apply AI Edit</span>
        </button>

        <!-- Secondary Action: Use Original -->
        <button class="w-full py-2.5 rounded-xl text-gray-500 hover:text-gray-800 hover:bg-gray-100 font-semibold text-xs text-center transition active:scale-95">
          Use Original (Skip AI)
        </button>
      </div>

    </main>

    <!-- Bottom Indicator -->
    <div class="flex justify-center pb-2 pt-1">
      <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
    </div>

  </div>

</body>
</html>
